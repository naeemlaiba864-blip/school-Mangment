<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission | EduManage</title>

    <link rel="stylesheet" href="Addmision.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<!-- ================= HEADER ================= -->

</header>

<!-- ================= PAGE BANNER ================= -->

<section class="hero">

    <div class="hero-content">

        <h1>Student Admission Form</h1>

        <p>
            Complete the admission form below to apply
            for the upcoming academic session.
        </p>

    </div>

</section>

<!-- ================= ADMISSION FORM ================= -->

<section class="admission">

<h2>Admission Application Form</h2>

<form id="admissionForm">

<!-- Student Information -->

<div class="form-group">

<h3>Student Information</h3>

<label>Student Full Name</label>

<input
type="text"
id="studentName"
placeholder="Enter Student Name"
required>

<label>Father Name</label>

<input
type="text"
id="fatherName"
placeholder="Enter Father Name"
required>

<label>Mother Name</label>

<input
type="text"
id="motherName"
placeholder="Enter Mother Name">

<label>Date of Birth</label>

<input
type="date"
id="dob"
required>

<label>Gender</label>

<select id="gender">

<option>Select Gender</option>

<option>Male</option>

<option>Female</option>

</select>

<label>CNIC / B-Form</label>

<input
type="text"
id="cnic"
placeholder="XXXXX-XXXXXXX-X">

</div>

<!-- Contact Information -->

<div class="form-group">

<h3>Contact Information</h3>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="example@gmail.com"
required>

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="03XXXXXXXXX"
required>

<label>Parent Phone</label>

<input
type="tel"
id="parentPhone"
placeholder="03XXXXXXXXX">

<label>Address</label>

<textarea
id="address"
rows="5"
placeholder="Complete Address"></textarea>

</div>

<!-- Academic Information -->

<div class="form-group">

<h3>Academic Information</h3>

<label>Select Class</label>

<select id="course">

<option>Select Class</option>

<option>Play Group</option>

<option>Nursery</option>

<option>Prep</option>

<option>Class 1</option>

<option>Class 2</option>

<option>Class 3</option>

<option>Class 4</option>

<option>Class 5</option>

<option>Class 6</option>

<option>Class 7</option>

<option>Class 8</option>

<option>Class 9</option>

<option>Class 10</option>

<option>1st Year</option>

<option>2nd Year</option>

</select>

<label>Previous School</label>

<input
type="text"
id="school"
placeholder="Previous School Name">

<label>Previous Percentage</label>

<input
type="number"
id="percentage"
placeholder="Enter Percentage">

<label>Upload Student Photo</label>

<input
type="file"
id="photo"
accept="image/*">

<br><br>

<button
type="submit"
class="btn">

Submit Admission

</button>

<button
type="reset"
class="btn2">

Reset Form

</button>

</div>

</form>

</section>

</body>
</html>
